<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trazabilidad de un lote – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
  
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="trazabilidad" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Trazabilidad de un lote</h1>
      <a class="btn btn-outline-secondary" href="lotes.html">Volver</a>
    </div>
    <div id="contenido-traza">
      <div class="tabla-card p-3 mb-4"><dl class="dato-lectura row mb-0" id="datos-lote"></dl></div>
      <h2 class="h5">Insumos usados</h2>
    <div class="table-responsive tabla-card mb-4">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Insumo</th><th>Cantidad consumida</th></tr></thead>
        <tbody id="tbody-insumos"></tbody>
      </table>
    </div>
      <h2 class="h5">Producción del lote</h2>
    <div class="table-responsive tabla-card mb-4">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Presentación</th><th>Producidas</th><th>Asignadas a pedidos</th><th>Sin asignar</th></tr></thead>
        <tbody id="tbody-producido"></tbody>
      </table>
    </div>
      <h2 class="h5">Pedidos donde se entregó</h2>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Pedido</th><th>Cliente</th><th>Presentación</th><th>Cantidad</th><th>Estado</th></tr></thead>
        <tbody id="tbody-pedidos"></tbody>
      </table>
    </div>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/produccion.js"></script>
</body>
</html>
