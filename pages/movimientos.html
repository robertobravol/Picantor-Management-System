<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movimientos de inventario – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="movimientos" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Movimientos de inventario</h1>
      
    </div>
    <p class="small text-muted">Solo consulta: los movimientos los generan las recepciones, los lotes y los pedidos.</p>
    <form id="filtros" class="tabla-card p-3 mb-3 row g-2 align-items-end">
      <div class="col-md-2"><label class="form-label" for="m-tipo">Tipo</label><select id="m-tipo" class="form-select"><option value="">Todos</option><option value="ENTRADA">ENTRADA</option><option value="SALIDA">SALIDA</option></select></div>
      <div class="col-md-2"><label class="form-label" for="m-origen">Origen</label><select id="m-origen" class="form-select"><option value="">Todos</option><option value="RECEPCION">RECEPCION</option><option value="CONSUMO_LOTE">CONSUMO_LOTE</option><option value="PRODUCCION_LOTE">PRODUCCION_LOTE</option><option value="PEDIDO">PEDIDO</option></select></div>
      <div class="col-md-3"><label class="form-label" for="m-item">Insumo o presentación</label><select id="m-item" class="form-select"></select></div>
      <div class="col-md-2"><label class="form-label" for="m-desde">Desde</label><input type="date" id="m-desde" class="form-control"></div>
      <div class="col-md-2"><label class="form-label" for="m-hasta">Hasta</label><input type="date" id="m-hasta" class="form-control"></div>
      <div class="col-md-1 d-grid"><button class="btn btn-picantor" type="submit">Filtrar</button></div>
      <div class="col-12"><button class="btn btn-outline-secondary btn-sm" type="button" id="btn-limpiar">Limpiar filtros</button> <span class="small text-muted ms-2" id="contador"></span></div>
    </form>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Ítem</th><th>Cantidad</th><th>Origen</th><th>Id origen</th><th>Registrado por</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/inventario.js"></script>
</body>
</html>
