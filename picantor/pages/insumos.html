<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insumos – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="insumos" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Insumos</h1>
      <button class="btn btn-picantor" id="btn-nuevo" type="button">Nuevo insumo</button>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6"><input id="buscar" class="form-control" type="search" placeholder="Buscar por nombre"></div>
      <div class="col-md-3"><select id="filtro-activo" class="form-select"><option value="">Todos</option><option value="1">Activos</option><option value="0">Inactivos</option></select></div>
    </div>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Nombre</th><th>Unidad de medida</th><th>Existencia actual</th><th>Activo</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="small text-muted mt-2">La existencia no se edita aquí: cambia solo con recepciones, lotes y pedidos.</p>
    <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="modal-titulo"></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
        <input type="hidden" id="f-id">
        <div class="mb-3">
          <label class="form-label" for="f-nombre">Nombre</label>
          <input class="form-control" id="f-nombre" required maxlength="100">
        </div>
        <div class="mb-3"><label class="form-label" for="f-unidad">Unidad de medida</label><select class="form-select" id="f-unidad" required></select></div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="f-activo" checked>
          <label class="form-check-label" for="f-activo">Activo</label>
        </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-picantor">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/abastecimiento.js"></script>
</body>
</html>
