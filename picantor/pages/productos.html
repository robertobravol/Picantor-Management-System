<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos y presentaciones – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="productos" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Productos y presentaciones</h1>
      <button class="btn btn-picantor" id="btn-nuevo-producto" type="button">Nuevo producto</button>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6"><input id="buscar" class="form-control" type="search" placeholder="Buscar por producto o presentación"></div>

    </div>
    <div id="contenedor"></div>
    <div class="modal fade" id="modal-producto" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="form-producto" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="modal-producto-titulo"></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
        <input type="hidden" id="fp-id">
        <div class="mb-3">
          <label class="form-label" for="fp-nombre">Nombre</label>
          <input class="form-control" id="fp-nombre" required maxlength="100">
        </div>
        <div class="mb-3"><label class="form-label" for="fp-descripcion">Descripción</label><textarea class="form-control" id="fp-descripcion" rows="3" maxlength="300"></textarea></div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="fp-activo" checked>
          <label class="form-check-label" for="fp-activo">Activo</label>
        </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-picantor">Guardar</button>
          </div>
        </form>
      </div>
    </div>
    <div class="modal fade" id="modal-presentacion" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="form-presentacion" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="modal-presentacion-titulo"></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
        <input type="hidden" id="fr-id">
        <div class="mb-3"><label class="form-label" for="fr-producto">Producto</label><select class="form-select" id="fr-producto" required></select></div>
        <div class="mb-3">
          <label class="form-label" for="fr-nombre">Nombre de la presentación</label>
          <input class="form-control" id="fr-nombre" required maxlength="60">
        </div>
        <div class="mb-3">
          <label class="form-label" for="fr-precio">Precio</label>
          <input class="form-control" id="fr-precio" type="number" min="0.01" step="0.01" required>
          <div class="form-text">El mismo precio para todos los clientes.</div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="fr-activo" checked>
          <label class="form-check-label" for="fr-activo">Activo</label>
        </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-picantor">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/inventario.js"></script>
</body>
</html>
