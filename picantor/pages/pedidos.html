<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="pedidos" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Pedidos</h1>
      
    </div>
    <form id="filtros" class="tabla-card p-3 mb-3 row g-2 align-items-end">
      <div class="col-md-3"><label class="form-label" for="f-estado">Estado</label><select id="f-estado" class="form-select"></select></div>
      <div class="col-md-3"><label class="form-label" for="f-cliente">Cliente</label><select id="f-cliente" class="form-select"></select></div>
      <div class="col-md-2"><label class="form-label" for="f-desde">Desde</label><input type="date" id="f-desde" class="form-control"></div>
      <div class="col-md-2"><label class="form-label" for="f-hasta">Hasta</label><input type="date" id="f-hasta" class="form-control"></div>
      <div class="col-md-2 d-grid"><button class="btn btn-picantor" type="submit">Filtrar</button></div>
      <div class="col-12"><button class="btn btn-outline-secondary btn-sm" type="button" id="btn-limpiar">Limpiar filtros</button> <span class="small text-muted ms-2" id="contador"></span></div>
    </form>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Pedido</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th>Total</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/pedidos.js"></script>
</body>
</html>
