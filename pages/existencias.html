<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Existencias – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="existencias" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Existencias</h1>
      
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6"><input id="buscar" class="form-control" type="search" placeholder="Buscar insumo o presentación"></div>

    </div>
    <h2 class="h5">Insumos</h2>
    <div class="table-responsive tabla-card mb-4">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Insumo</th><th>Unidad</th><th>Existencia actual</th><th></th></tr></thead>
        <tbody id="tbody-insumos"></tbody>
      </table>
    </div>
    <h2 class="h5">Producto terminado</h2>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Presentación</th><th>Existencia actual</th><th></th></tr></thead>
        <tbody id="tbody-presentaciones"></tbody>
      </table>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/inventario.js"></script>
</body>
</html>
