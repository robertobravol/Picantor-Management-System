<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compras y recepciones – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="compras" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Compras y recepciones</h1>
      <button class="btn btn-picantor" id="btn-nuevo" type="button">Nueva compra</button>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6"><input id="buscar" class="form-control" type="search" placeholder="Buscar por número de compra o proveedor"></div>
      <div class="col-md-3"><select id="filtro-estado" class="form-select"><option value="">Todas las recepciones</option><option value="PENDIENTE">Pendientes</option><option value="PARCIAL">Parciales</option><option value="COMPLETA">Completas</option></select></div>
    </div>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Compra</th><th>Proveedor</th><th>Fecha de compra</th><th>Registrada por</th><th>Recepción</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="modal fade" id="modal-compra" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="form-compra" novalidate>
          <div class="modal-header"><h2 class="modal-title h5">Nueva compra</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
          <div class="modal-body">
            <div class="row g-3 mb-3">
              <div class="col-md-8"><label class="form-label" for="c-proveedor">Proveedor</label><select class="form-select" id="c-proveedor" required></select></div>
              <div class="col-md-4"><label class="form-label" for="c-fecha">Fecha de compra</label><input class="form-control" type="date" id="c-fecha" required></div>
            </div>
            <h3 class="h6">Insumos</h3>
            <table class="table table-sm align-middle"><thead><tr><th>Insumo</th><th style="width:180px">Cantidad comprada</th><th></th></tr></thead><tbody id="filas-compra"></tbody></table>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-add-linea">Agregar insumo</button>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-picantor">Guardar compra</button></div>
        </form>
      </div>
    </div>

    <div class="modal fade" id="modal-detalle" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header"><h2 class="modal-title h5">Detalle de la compra</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
          <div class="modal-body" id="detalle-contenido"></div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-recepcion" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="form-recepcion" novalidate>
          <div class="modal-header"><h2 class="modal-title h5">Registrar recepción de la compra <span id="rc-compra-texto"></span></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
          <div class="modal-body">
            <input type="hidden" id="rc-compra-id">
            <div class="mb-3" style="max-width:240px"><label class="form-label" for="rc-fecha">Fecha de recepción</label><input class="form-control" type="date" id="rc-fecha" required></div>
            <table class="table table-sm align-middle"><thead><tr><th>Insumo</th><th>Comprado</th><th>Ya recibido</th><th>Pendiente</th><th style="width:170px">Cantidad recibida</th></tr></thead><tbody id="filas-recepcion"></tbody></table>
            <p class="small text-muted mb-0">Confirmar aumenta la existencia de cada insumo recibido.</p>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-picantor">Confirmar recepción</button></div>
        </form>
      </div>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/abastecimiento.js"></script>
</body>
</html>
