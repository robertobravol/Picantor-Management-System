<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="perfil" data-roles="cliente">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="row justify-content-center"><div class="col-lg-7"><div class="tabla-card p-4">
      <h1 class="h4 mb-3">Mi perfil</h1>
      <form id="form" novalidate>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="p-username">Usuario</label><input class="form-control" id="p-username" readonly></div>
          <div class="col-md-6"><label class="form-label" for="p-email">Correo electrónico</label><input class="form-control" id="p-email" type="email" required maxlength="120"></div>
          <div class="col-12"><label class="form-label" for="p-nombre">Nombre o razón social</label><input class="form-control" id="p-nombre" required maxlength="150"></div>
          <div class="col-md-4"><label class="form-label" for="p-tipo">Tipo de identificación</label><select class="form-select" id="p-tipo" required></select></div>
          <div class="col-md-8"><label class="form-label" for="p-identificacion">Identificación</label><input class="form-control" id="p-identificacion" required maxlength="20"></div>
          <div class="col-md-6"><label class="form-label" for="p-telefono">Teléfono</label><input class="form-control" id="p-telefono" maxlength="20"></div>
          <div class="col-md-6"><label class="form-label" for="p-direccion">Dirección</label><input class="form-control" id="p-direccion" maxlength="200"></div>
        </div>
        <div class="mt-4 d-flex gap-2"><button class="btn btn-picantor" type="submit">Guardar cambios</button><a class="btn btn-outline-secondary" href="inicio-cliente.html">Cancelar</a></div>
      </form>
    </div></div></div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/pedidos.js"></script>
</body>
</html>
