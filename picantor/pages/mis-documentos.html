<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis pagos y documentos – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="mis-documentos" data-roles="cliente">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Mis pagos y documentos</h1>
      <a class="btn btn-outline-secondary" href="inicio-cliente.html">Volver</a>
    </div>
    <h2 class="h5">Pagos</h2>
    <div class="table-responsive tabla-card mb-4">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Pedido</th><th>Monto</th><th>Estado</th><th>Fecha</th></tr></thead>
        <tbody id="tbody-pagos"></tbody>
      </table>
    </div>
    <h2 class="h5">Documentos</h2>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Tipo</th><th>Número</th><th>Fecha de emisión</th><th>Total</th><th></th></tr></thead>
        <tbody id="tbody-docs"></tbody>
      </table>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/pagos.js"></script>
</body>
</html>
