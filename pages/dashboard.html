<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
</head>
<body data-pagina="dashboard" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="viz-root">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <h1 class="h3 mb-0">Dashboard</h1>
      </div>
      <div class="row g-2 mb-3 align-items-end no-imprimir">
        <div class="col-auto">
          <label class="form-label small mb-1" for="p-tipo">Período</label>
          <select class="form-select" id="p-tipo">
            <option value="todo">Todo el historial</option>
            <option value="mes">Mes actual</option>
            <option value="30">Últimos 30 días</option>
            <option value="7">Últimos 7 días</option>
            <option value="rango">Rango personalizado</option>
          </select>
        </div>
        <div class="col-auto d-none" id="p-rango">
          <div class="row g-2">
            <div class="col-auto"><label class="form-label small mb-1" for="p-desde">Desde</label><input class="form-control" type="date" id="p-desde"></div>
            <div class="col-auto"><label class="form-label small mb-1" for="p-hasta">Hasta</label><input class="form-control" type="date" id="p-hasta"></div>
          </div>
        </div>
      </div>
      <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
      <div class="row g-3 mb-3">
        <div class="col-lg-4" id="hero"></div>
        <div class="col-lg-8"><div class="row g-3" id="fichas"></div></div>
      </div>
      <div class="row g-3 mb-4" id="graficos"></div>
      <h2 class="h5">Situación actual</h2>
      <div class="row g-3">
        <div class="col-lg-6" id="situacion-existencias"></div>
        <div class="col-lg-6" id="situacion-lotes"></div>
      </div>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/dashboard.js"></script>
</body>
</html>
