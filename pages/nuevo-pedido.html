<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo pedido – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="nuevo-pedido" data-roles="cliente">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Nuevo pedido</h1>
      
    </div>
    <form id="form" class="tabla-card p-3" novalidate>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead><tr><th>Presentación</th><th>Precio</th><th style="width:130px">Cantidad</th><th>Subtotal</th><th></th></tr></thead>
          <tbody id="filas"></tbody>
          <tfoot><tr><th colspan="3" class="text-end">Total</th><th id="total">$0.00</th><th></th></tr></tfoot>
        </table>
      </div>
      <button type="button" class="btn btn-outline-secondary btn-sm mb-3" id="btn-add-linea">Agregar línea</button>
      <p class="small text-muted">Se verifica la disponibilidad al confirmar. El pedido se confirma cuando el pago con tarjeta sea exitoso.</p>
      <div class="d-flex gap-2"><button class="btn btn-picantor" type="submit">Confirmar y pagar</button><a class="btn btn-outline-secondary" href="inicio-cliente.html">Cancelar</a></div>
    </form>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/pedidos.js"></script>
</body>
</html>
