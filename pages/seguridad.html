<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguridad – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="seguridad" data-roles="personal">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Seguridad</h1>
      <button class="btn btn-picantor" id="btn-nueva-cuenta" type="button">Nueva cuenta del personal</button>
    </div>
    <div class="alert alert-warning small">Pantalla simulada: la gestión real de usuarios, grupos y permisos se hará después con Django. Aquí no hay seguridad real.</div>
    <h2 class="h5">Cuentas del personal</h2>
    <div class="table-responsive tabla-card mb-4">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Usuario</th><th>Correo</th><th>Activa</th><th></th></tr></thead>
        <tbody id="tbody-cuentas"></tbody>
      </table>
    </div>
    <h2 class="h5">Actividad reciente</h2>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead>
        <tbody id="tbody-actividad"></tbody>
      </table>
    </div>
    <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5">Nueva cuenta del personal</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="f-username">Usuario</label>
          <input class="form-control" id="f-username" required maxlength="40" autocomplete="off">
        </div>
        <div class="mb-3">
          <label class="form-label" for="f-email">Correo electrónico</label>
          <input class="form-control" id="f-email" type="email" required maxlength="120">
        </div>
        <div class="mb-3">
          <label class="form-label" for="f-password">Contraseña</label>
          <input class="form-control" id="f-password" type="password" required minlength="6" autocomplete="off">
          <div class="form-text">Mínimo 6 caracteres. Es solo una demostración.</div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="f-activo" checked>
          <label class="form-check-label" for="f-activo">Cuenta activa</label>
        </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-picantor">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/seguridad.js"></script>
</body>
</html>
