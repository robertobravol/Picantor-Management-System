<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pago en línea – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="pago" data-roles="cliente">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="row justify-content-center"><div class="col-lg-6" id="contenido-pago"><div class="tabla-card p-4">
      <h1 class="h4">Pago con tarjeta</h1>
      <div class="alert alert-warning small"><strong>Simulación.</strong> No se cobra nada: los datos de la tarjeta no se guardan ni se envían a ningún sitio. Usa cualquier número de prueba de 13 a 19 dígitos.</div>
      <dl class="dato-lectura row" id="info-pedido"></dl>
      <form id="form" novalidate autocomplete="off">
        <div class="mb-3"><label class="form-label" for="t-numero">Número de tarjeta</label><input class="form-control" id="t-numero" inputmode="numeric" required autocomplete="off" placeholder="4111 1111 1111 1111"></div>
        <div class="mb-3"><label class="form-label" for="t-titular">Titular</label><input class="form-control" id="t-titular" required autocomplete="off"></div>
        <div class="row g-3 mb-3">
          <div class="col-6"><label class="form-label" for="t-venc">Vencimiento (MM/AA)</label><input class="form-control" id="t-venc" required autocomplete="off" placeholder="12/29"></div>
          <div class="col-6"><label class="form-label" for="t-cvv">Código de seguridad</label><input class="form-control" id="t-cvv" type="password" inputmode="numeric" required autocomplete="off"></div>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-picantor" type="submit">Pagar</button>
          <button class="btn btn-outline-danger" type="button" id="btn-fallido">Simular pago fallido (solo demo)</button>
          <a class="btn btn-outline-secondary" href="mis-pedidos.html">Cancelar</a>
        </div>
      </form>
    </div></div></div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/pagos.js"></script>
</body>
</html>
