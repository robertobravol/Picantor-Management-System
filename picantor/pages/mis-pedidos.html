<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis pedidos – Picantor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
    <link rel="icon" href="../img/restaurant.png" type="image/x-icon"> 

</head>
<body data-pagina="mis-pedidos" data-roles="cliente">
  <div id="navbar"></div>
  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Mis pedidos</h1>
      <a class="btn btn-picantor" href="nuevo-pedido.html">Nuevo pedido</a>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6"><input id="buscar" class="form-control" type="search" placeholder="Buscar por número de pedido"></div>
      <div class="col-md-3"><select id="filtro-estado" class="form-select"></select></div>
    </div>
    <div class="table-responsive tabla-card">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Pedido</th><th>Fecha</th><th>Estado</th><th>Total</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/logica.js"></script>
  <script src="../js/paginas/pedidos.js"></script>
</body>
</html>
